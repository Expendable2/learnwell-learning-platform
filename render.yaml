services:
  - type: web
    name: learnwell
    runtime: node
    region: oregon
    plan: free
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: PGSSLMODE
        value: require
      - key: PG_POOL_MAX
        value: "10"
      - key: DATABASE_URL
        fromDatabase:
          name: learnwell-db
          property: connectionString

databases:
  - name: learnwell-db
    databaseName: learnwell
    user: learnwell
    region: oregon
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
